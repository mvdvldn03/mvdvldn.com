<header class="site-header">
  <a class="prompt-home" href="{{ "/" | relURL }}">
    <span class="prompt-user">{{ .Site.Params.prompt }}</span><span class="prompt-tilde">:~$</span>
  </a>
  <nav class="site-nav">
    {{ $current := .RelPermalink }}
    {{ range .Site.Menus.main }}
      <a href="{{ .URL | relURL }}" class="{{ if eq $current .URL }}active{{ end }}">{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
